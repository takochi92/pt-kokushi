# サイトを組み立てて GitHub Pages に公開する（毎朝 note の最新記事も取り込み直す）
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日 7:13（日本時間）
    - cron: "13 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # note の公開データ（スキ数など）を stats ブランチに保存する。編集部ページの分析タブに社長が反映する
  note-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/note-stats.mjs > "$RUNNER_TEMP/note-stats.json"
      - name: Save to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin stats; then git switch -c stats FETCH_HEAD; else git switch --orphan stats; git rm -rf --quiet . || true; fi
          cp "$RUNNER_TEMP/note-stats.json" note-stats.json
          git add note-stats.json
          git diff --cached --quiet || git commit -m "note の公開データ $(date -u +%Y-%m-%d)"
          git push origin stats
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
